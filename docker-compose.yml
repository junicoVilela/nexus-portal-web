services:
  softon-portal-web:
    image: node:22-alpine
    container_name: softon-portal-web
    working_dir: /workspace
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ./frontend:/workspace
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
