<div class="ui-list">
  <ui-page-header [title]="title()" [subtitle]="subtitle()" [icon]="icon()">
    <ng-content select="[breadcrumb]" ngProjectAs="[breadcrumb]" />
    <ng-content select="[actions]" ngProjectAs="[actions]" />
  </ui-page-header>

  <div class="ui-list__filters"><ng-content select="[filters]" /></div>

  @if (error()) {
    <ui-error-state
      [variant]="errorVariant()"
      [description]="error()"
      [showRetry]="showRetry()"
      (retry)="retry.emit()"
    />
  } @else if (loading()) {
    <div class="ui-list__loading" aria-busy="true">
      @for (i of [0, 1, 2, 3, 4]; track i) {
        <div class="ui-list__skeleton-row"></div>
      }
    </div>
  } @else if (isEmpty()) {
    <ui-empty-state
      [icon]="emptyIcon()"
      [illustration]="emptyIllustration()"
      [title]="emptyTitle()"
      [description]="emptyDescription()"
    >
      <ng-content select="[empty-actions]" />
    </ui-empty-state>
  } @else {
    <div class="ui-list__content"><ng-content /></div>
  }
</div>
