<form [formGroup]="form()" (ngSubmit)="aplicarFiltros.emit()" class="paginas__filters">
  <div class="paginas__filter-row">
    <input
      class="paginas__search"
      formControlName="busca"
      placeholder="Busca full-text em título, resumo e código..."
      aria-label="Buscar em título, resumo e código"
    />
    <input class="paginas__input" formControlName="titulo" placeholder="Título" aria-label="Filtrar por título" />
    <input
      class="paginas__input"
      formControlName="codigoTela"
      placeholder="Código tela"
      aria-label="Filtrar por código da tela"
    />
  </div>
  <div class="paginas__filter-row">
    <select
      class="paginas__select"
      formControlName="projetoId"
      aria-label="Filtrar por projeto"
      (change)="projetoChange.emit()"
    >
      <option value="">Todos os projetos</option>
      @for (p of projetos(); track p.id) {
        <option [value]="p.id">{{ p.nome }}</option>
      }
    </select>
    <select class="paginas__select" formControlName="moduloId" aria-label="Filtrar por módulo">
      <option value="">Todos os módulos</option>
      @for (m of modulos(); track m.id) {
        <option [value]="m.id">{{ m.nome }}</option>
      }
    </select>
    <select class="paginas__select" formControlName="status" aria-label="Filtrar por status">
      <option value="">Todos os status</option>
      <option>RASCUNHO</option>
      <option>EM_REVISAO</option>
      <option>APROVADO</option>
      <option>PUBLICADO</option>
      <option>ARQUIVADO</option>
    </select>
    <div class="paginas__filter-actions">
      <ui-button variant="ghost" size="sm" type="button" icon="FilterX" (clicked)="limparFiltros.emit()">Limpar</ui-button>
      <ui-button size="sm" type="submit">Filtrar</ui-button>
    </div>
  </div>
  <ui-status-pill-bar
    [items]="pillItems()"
    [value]="form().controls['status'].value"
    [todosCount]="totalSistema()"
    (selecionar)="statusEditorial.emit($event)"
  />
</form>
