<div class="ai-perguntas">
  <h2>Perguntas</h2>
  @for (p of perguntas(); track p.id) {
    <label [attr.for]="'q-' + p.id">
      {{ p.texto }}
      @if (p.obrigatoria) {
        <span class="ai-perguntas__req">*</span>
      }
      @if (p.opcoes.length) {
        <select
          [id]="'q-' + p.id"
          [value]="respostas()[p.id] || ''"
          [disabled]="disabled()"
          (change)="setResposta(p.id, $any($event.target).value)"
        >
          <option value="" disabled>Selecione…</option>
          @for (op of p.opcoes; track op) {
            <option [value]="op">{{ op }}</option>
          }
        </select>
      } @else {
        <input
          [id]="'q-' + p.id"
          type="text"
          [value]="respostas()[p.id] || ''"
          [disabled]="disabled()"
          (input)="setResposta(p.id, $any($event.target).value)"
        />
      }
    </label>
  }
  <div class="ai-perguntas__actions">
    <ui-button
      type="button"
      variant="primary"
      icon="Send"
      [loading]="loading()"
      [disabled]="disabled()"
      (clicked)="enviar.emit()"
    >
      Enviar respostas
    </ui-button>
  </div>
</div>
