<div class="ai-shell">
  <aside class="ai-shell__side" aria-label="Assistente IA">
    <div class="ai-shell__brand">
      <span class="ai-shell__brand-icon"><lucide-icon name="Sparkles" /></span>
      <div class="ai-shell__brand-text">
        <span class="ai-shell__brand-name">Nexus AI</span>
        <span class="ai-shell__brand-sub">Assistente de páginas</span>
      </div>
    </div>
    <nav class="ai-shell__nav">
      @for (item of navItems(); track item.route.join('/')) {
        <a
          class="ai-shell__nav-link"
          [routerLink]="item.route"
          routerLinkActive="ai-shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <lucide-icon [name]="item.icon" class="ai-shell__nav-icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>
  <main class="ai-shell__main">
    <router-outlet />
  </main>
</div>
